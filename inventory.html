<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemist POS - Inventory Management</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: #667eea;
            font-size: 14px;
            font-weight: 400;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn.active {
            background: #667eea;
            color: white;
        }

        .nav-btn:not(.active) {
            background: #f3f4f6;
            color: #4b5563;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* ===== INVENTORY SECTION ===== */
        .inventory-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #4b5563;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-danger {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        /* ===== SEARCH & FILTERS ===== */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .search-box input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            border: none;
            background: #f3f4f6;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-tab:hover {
            background: #667eea;
            color: white;
        }

        .filter-tab.active {
            background: #667eea;
            color: white;
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
        }

        .stat-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .stat-value.warning {
            color: #f59e0b;
        }

        .stat-value.danger {
            color: #ef4444;
        }

        .stat-value.success {
            color: #10b981;
        }

        /* ===== INVENTORY TABLE ===== */
        .table-container {
            overflow-x: auto;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #4b5563;
            border-bottom: 2px solid #e5e7eb;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .product-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
        }

        .stock-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .stock-normal {
            background: #d1fae5;
            color: #065f46;
        }

        .stock-low {
            background: #fee2e2;
            color: #991b1b;
        }

        .expiry-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .expiry-normal {
            background: #d1fae5;
            color: #065f46;
        }

        .expiry-soon {
            background: #fed7aa;
            color: #92400e;
        }

        .expiry-critical {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-btn {
            background: #dbeafe;
            color: #3b82f6;
        }

        .edit-btn:hover {
            background: #3b82f6;
            color: white;
        }

        .delete-btn {
            background: #fee2e2;
            color: #ef4444;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: white;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification.success { border-left: 4px solid #10b981; }
        .notification.error { border-left: 4px solid #ef4444; }
        .notification.info { border-left: 4px solid #3b82f6; }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .section-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-clinic-medical"></i>
                </div>
                <div>
                    <h1>Chemist POS <span>by SAFTECH</span></h1>
                </div>
            </div>
            <div class="nav-buttons">
                <a href="index.html" class="nav-btn">
                    <i class="fas fa-cash-register"></i> POS
                </a>
                <a href="#" class="nav-btn active">
                    <i class="fas fa-boxes"></i> Inventory
                </a>
                <a href="#" class="nav-btn" onclick="showNotification('Customers page coming soon!', 'info')">
                    <i class="fas fa-users"></i> Customers
                </a>
                <a href="#" class="nav-btn" onclick="showNotification('Reports page coming soon!', 'info')">
                    <i class="fas fa-chart-bar"></i> Reports
                </a>
            </div>
        </header>

        <!-- INVENTORY SECTION -->
        <div class="inventory-section">
            <div class="section-header">
                <div class="section-title">
                    <i class="fas fa-boxes"></i>
                    <span>Inventory Management</span>
                </div>
                <button class="btn-primary" onclick="openAddProductModal()">
                    <i class="fas fa-plus"></i> Add New Product
                </button>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-boxes" style="color: #667eea;"></i>
                        Total Products
                    </div>
                    <div class="stat-value" id="totalProducts">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-exclamation-triangle" style="color: #f59e0b;"></i>
                        Low Stock (<20)
                    </div>
                    <div class="stat-value warning" id="lowStockCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-clock" style="color: #ef4444;"></i>
                        Expiring Soon (30 days)
                    </div>
                    <div class="stat-value danger" id="expiringSoonCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-check-circle" style="color: #10b981;"></i>
                        In Stock Items
                    </div>
                    <div class="stat-value success" id="inStockCount">0</div>
                </div>
            </div>

            <!-- Search and Filters -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" 
                       id="searchInput" 
                       placeholder="Search products by name or category..."
                       onkeyup="searchInventory()">
            </div>

            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" onclick="filterInventory('all', this)">
                    <i class="fas fa-border-all"></i> All Products
                </button>
                <button class="filter-tab" data-filter="low-stock" onclick="filterInventory('low-stock', this)">
                    <i class="fas fa-exclamation-triangle"></i> Low Stock
                </button>
                <button class="filter-tab" data-filter="expiring" onclick="filterInventory('expiring', this)">
                    <i class="fas fa-clock"></i> Expiring Soon
                </button>
                <button class="filter-tab" data-filter="in-stock" onclick="filterInventory('in-stock', this)">
                    <i class="fas fa-check"></i> In Stock
                </button>
            </div>

            <!-- Inventory Table -->
            <div class="table-container">
                <table id="inventoryTable">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price (KSH)</th>
                            <th>Stock</th>
                            <th>Expiry Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ADD/EDIT PRODUCT MODAL -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Add New Product</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productId" value="">
                
                <div class="form-group">
                    <label class="form-label">Product Name</label>
                    <input type="text" id="productName" class="form-control" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="productCategory" class="form-control" required>
                            <option value="antibiotics">Antibiotics</option>
                            <option value="painkillers">Painkillers</option>
                            <option value="vitamins">Vitamins</option>
                            <option value="diabetes">Diabetes</option>
                            <option value="blood-pressure">Blood Pressure</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Price (KSH)</label>
                        <input type="number" id="productPrice" class="form-control" required min="0">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Stock Quantity</label>
                        <input type="number" id="productStock" class="form-control" required min="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Expiry Date</label>
                        <input type="date" id="productExpiry" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Manufacturer</label>
                    <input type="text" id="productManufacturer" class="form-control">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Icon</label>
                    <select id="productIcon" class="form-control">
                        <option value="fa-pills">Pills</option>
                        <option value="fa-capsules">Capsules</option>
                        <option value="fa-tablets">Tablets</option>
                        <option value="fa-syringe">Syringe</option>
                        <option value="fa-heartbeat">Heart</option>
                    </select>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ===== INVENTORY MANAGEMENT - COMPLETE JAVASCRIPT =====
        
        // Data Storage
        let products = [];

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            displayInventory();
            updateStats();
        });

        // Load Products (from localStorage or sample data)
        function loadProducts() {
            const savedProducts = localStorage.getItem('chemistProducts');
            if (savedProducts) {
                products = JSON.parse(savedProducts);
            } else {
                // Sample data
                products = [
                    {
                        id: 1,
                        name: "Amoxicillin 500mg",
                        category: "antibiotics",
                        price: 450,
                        stock: 150,
                        expiry: "2024-12-31",
                        manufacturer: "Cosmos Pharma",
                        icon: "fa-capsules"
                    },
                    {
                        id: 2,
                        name: "Paracetamol 500mg",
                        category: "painkillers",
                        price: 120,
                        stock: 500,
                        expiry: "2025-06-30",
                        manufacturer: "Dawa Limited",
                        icon: "fa-tablets"
                    },
                    {
                        id: 3,
                        name: "Vitamin C 1000mg",
                        category: "vitamins",
                        price: 850,
                        stock: 75,
                        expiry: "2025-03-15",
                        manufacturer: "Nature's Way",
                        icon: "fa-pills"
                    },
                    {
                        id: 4,
                        name: "Metformin 850mg",
                        category: "diabetes",
                        price: 320,
                        stock: 200,
                        expiry: "2024-11-30",
                        manufacturer: "Beta Healthcare",
                        icon: "fa-capsules"
                    },
                    {
                        id: 5,
                        name: "Losartan 50mg",
                        category: "blood-pressure",
                        price: 550,
                        stock: 12,
                        expiry: "2024-10-15",
                        manufacturer: "Eli Lilly",
                        icon: "fa-tablets"
                    },
                    {
                        id: 6,
                        name: "Ciprofloxacin 500mg",
                        category: "antibiotics",
                        price: 680,
                        stock: 8,
                        expiry: "2024-09-30",
                        manufacturer: "Cosmos Pharma",
                        icon: "fa-capsules"
                    },
                    {
                        id: 7,
                        name: "Ibuprofen 400mg",
                        category: "painkillers",
                        price: 250,
                        stock: 300,
                        expiry: "2025-02-28",
                        manufacturer: "Dawa Limited",
                        icon: "fa-tablets"
                    },
                    {
                        id: 8,
                        name: "Vitamin B Complex",
                        category: "vitamins",
                        price: 650,
                        stock: 5,
                        expiry: "2024-08-30",
                        manufacturer: "Nature's Way",
                        icon: "fa-pills"
                    }
                ];
                saveToLocalStorage();
            }
        }

        // Save to localStorage
        function saveToLocalStorage() {
            localStorage.setItem('chemistProducts', JSON.stringify(products));
        }

        // Display Inventory
        function displayInventory() {
            const tbody = document.getElementById('inventoryTableBody');
            if (!tbody) return;

            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const activeFilter = document.querySelector('.filter-tab.active')?.dataset.filter || 'all';

            let filteredProducts = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchTerm) ||
                                     p.category?.toLowerCase().includes(searchTerm) ||
                                     p.manufacturer?.toLowerCase().includes(searchTerm);
                
                if (!matchesSearch) return false;

                switch(activeFilter) {
                    case 'low-stock':
                        return p.stock < 20;
                    case 'expiring':
                        return daysUntilExpiry(p.expiry) <= 30;
                    case 'in-stock':
                        return p.stock > 0;
                    default:
                        return true;
                }
            });

            if (filteredProducts.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px; color: #999;">
                            <i class="fas fa-box-open" style="font-size: 40px; margin-bottom: 15px; opacity: 0.3;"></i>
                            <p>No products found</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filteredProducts.map(product => {
                const expiryStatus = getExpiryStatus(product.expiry);
                const stockStatus = product.stock < 20 ? 'stock-low' : 'stock-normal';
                
                return `
                    <tr>
                        <td>
                            <div class="product-info">
                                <div class="product-icon">
                                    <i class="fas ${product.icon || 'fa-pills'}"></i>
                                </div>
                                <div>
                                    <strong>${product.name}</strong>
                                    <div style="font-size: 12px; color: #666;">${product.manufacturer || ''}</div>
                                </div>
                            </div>
                        </td>
                        <td>${formatCategory(product.category)}</td>
                        <td><strong>KSH ${product.price}</strong></td>
                        <td>
                            <span class="stock-badge ${stockStatus}">
                                ${product.stock} units
                            </span>
                        </td>
                        <td>${formatDate(product.expiry)}</td>
                        <td>
                            <span class="expiry-badge ${expiryStatus.class}">
                                ${expiryStatus.text}
                            </span>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button class="action-btn edit-btn" onclick="editProduct(${product.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="action-btn delete-btn" onclick="deleteProduct(${product.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Format Category
        function formatCategory(category) {
            const categories = {
                'antibiotics': 'Antibiotics',
                'painkillers': 'Painkillers',
                'vitamins': 'Vitamins',
                'diabetes': 'Diabetes',
                'blood-pressure': 'Blood Pressure',
                'other': 'Other'
            };
            return categories[category] || category;
        }

        // Format Date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-GB', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }

        // Get Expiry Status
        function getExpiryStatus(expiryDate) {
            const days = daysUntilExpiry(expiryDate);
            
            if (days < 0) {
                return { class: 'expiry-critical', text: 'Expired' };
            } else if (days <= 30) {
                return { class: 'expiry-critical', text: `Expires in ${days} days` };
            } else if (days <= 90) {
                return { class: 'expiry-soon', text: `Expires in ${days} days` };
            } else {
                return { class: 'expiry-normal', text: 'Good' };
            }
        }

        // Days Until Expiry
        function daysUntilExpiry(expiryDate) {
            const today = new Date();
            const expiry = new Date(expiryDate);
            const diffTime = expiry - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // Update Statistics
        function updateStats() {
            const totalProducts = products.length;
            const lowStock = products.filter(p => p.stock < 20).length;
            const expiringSoon = products.filter(p => {
                const days = daysUntilExpiry(p.expiry);
                return days >= 0 && days <= 30;
            }).length;
            const inStock = products.filter(p => p.stock > 0).length;

            document.getElementById('totalProducts').textContent = totalProducts;
            document.getElementById('lowStockCount').textContent = lowStock;
            document.getElementById('expiringSoonCount').textContent = expiringSoon;
            document.getElementById('inStockCount').textContent = inStock;
        }

        // Search Inventory
        function searchInventory() {
            displayInventory();
        }

        // Filter Inventory
        function filterInventory(filter, element) {
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');
            displayInventory();
        }

        // Open Add Product Modal
        function openAddProductModal() {
            document.getElementById('modalTitle').textContent = 'Add New Product';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            
            // Set default expiry date (1 year from now)
            const nextYear = new Date();
            nextYear.setFullYear(nextYear.getFullYear() + 1);
            document.getElementById('productExpiry').value = nextYear.toISOString().split('T')[0];
            
            document.getElementById('productModal').classList.add('active');
        }

        // Edit Product
        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('modalTitle').textContent = 'Edit Product';
            document.getElementById('productId').value = product.id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productCategory').value = product.category;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productStock').value = product.stock;
            document.getElementById('productExpiry').value = product.expiry;
            document.getElementById('productManufacturer').value = product.manufacturer || '';
            document.getElementById('productIcon').value = product.icon || 'fa-pills';

            document.getElementById('productModal').classList.add('active');
        }

        // Save Product
        function saveProduct(event) {
            event.preventDefault();

            const productId = document.getElementById('productId').value;
            const productData = {
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                price: parseFloat(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value),
                expiry: document.getElementById('productExpiry').value,
                manufacturer: document.getElementById('productManufacturer').value,
                icon: document.getElementById('productIcon').value
            };

            if (productId) {
                // Update existing product
                const index = products.findIndex(p => p.id == productId);
                if (index !== -1) {
                    products[index] = { ...products[index], ...productData };
                    showNotification('Product updated successfully!', 'success');
                }
            } else {
                // Add new product
                const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.push({ id: newId, ...productData });
                showNotification('Product added successfully!', 'success');
            }

            saveToLocalStorage();
            displayInventory();
            updateStats();
            closeModal();
        }

        // Delete Product
        function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                products = products.filter(p => p.id !== id);
                saveToLocalStorage();
                displayInventory();
                updateStats();
                showNotification('Product deleted successfully!', 'info');
            }
        }

        // Close Modal
        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        // Show Notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 
                                 type === 'error' ? 'fa-exclamation-circle' : 
                                 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('productModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
