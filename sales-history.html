<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemist POS - Sales History</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: #667eea;
            font-size: 14px;
            font-weight: 400;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn.active {
            background: #667eea;
            color: white;
        }

        .nav-btn:not(.active) {
            background: #f3f4f6;
            color: #4b5563;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* ===== SALES HISTORY SECTION ===== */
        .sales-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #4b5563;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-success {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-success:hover {
            background: #059669;
        }

        /* ===== DATE RANGE FILTER ===== */
        .date-filter {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .date-range {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .date-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
        }

        .date-input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }

        .date-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .quick-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quick-filter-btn {
            padding: 8px 16px;
            border: none;
            background: white;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .quick-filter-btn:hover {
            background: #667eea;
            color: white;
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
        }

        .stat-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .stat-value small {
            font-size: 14px;
            color: #666;
            font-weight: 400;
        }

        /* ===== SEARCH BAR ===== */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .search-box input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* ===== SALES TABLE ===== */
        .table-container {
            overflow-x: auto;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #4b5563;
            border-bottom: 2px solid #e5e7eb;
            cursor: pointer;
            transition: all 0.3s;
        }

        th:hover {
            background: #e5e7eb;
        }

        th i {
            margin-left: 5px;
            font-size: 12px;
            color: #999;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .sale-id {
            font-weight: 600;
            color: #667eea;
        }

        .sale-time {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }

        .customer-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .customer-avatar {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .customer-details {
            line-height: 1.3;
        }

        .customer-name {
            font-weight: 600;
            font-size: 14px;
        }

        .customer-phone {
            font-size: 12px;
            color: #666;
        }

        .items-list {
            max-width: 200px;
        }

        .item-tag {
            display: inline-block;
            background: #e0e7ff;
            color: #4f46e5;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin: 2px;
        }

        .payment-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .payment-cash {
            background: #d1fae5;
            color: #065f46;
        }

        .payment-mpesa {
            background: #dbeafe;
            color: #1e40af;
        }

        .payment-card {
            background: #fef3c7;
            color: #92400e;
        }

        .amount {
            font-weight: 700;
            color: #059669;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-voided {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-refunded {
            background: #fff3cd;
            color: #856404;
        }

        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 2px;
        }

        .view-btn {
            background: #dbeafe;
            color: #3b82f6;
        }

        .view-btn:hover {
            background: #3b82f6;
            color: white;
        }

        .receipt-btn {
            background: #e0e7ff;
            color: #4f46e5;
        }

        .receipt-btn:hover {
            background: #4f46e5;
            color: white;
        }

        /* ===== PAGINATION ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 8px 15px;
            border: none;
            background: #f3f4f6;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn:hover {
            background: #667eea;
            color: white;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
        }

        .page-info {
            font-size: 14px;
            color: #666;
        }

        /* ===== RECEIPT MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        /* ===== RECEIPT STYLES ===== */
        .receipt {
            font-family: 'Courier New', monospace;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .receipt-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #333;
        }

        .receipt-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .receipt-info {
            margin-bottom: 20px;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .receipt-items {
            margin-bottom: 20px;
        }

        .receipt-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .receipt-item-name {
            flex: 2;
        }

        .receipt-item-qty {
            flex: 1;
            text-align: center;
        }

        .receipt-item-price {
            flex: 1;
            text-align: right;
        }

        .receipt-total {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px dashed #333;
            font-weight: 700;
        }

        .receipt-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #333;
            font-size: 12px;
            color: #666;
        }

        .print-btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== EXPORT BUTTONS ===== */
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .export-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .export-csv {
            background: #10b981;
            color: white;
        }

        .export-pdf {
            background: #ef4444;
            color: white;
        }

        .export-excel {
            background: #3b82f6;
            color: white;
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification.success { border-left: 4px solid #10b981; }
        .notification.error { border-left: 4px solid #ef4444; }
        .notification.info { border-left: 4px solid #3b82f6; }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .date-filter {
                flex-direction: column;
                align-items: stretch;
            }
            
            .date-range {
                flex-direction: column;
            }
            
            .export-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-clinic-medical"></i>
                </div>
                <div>
                    <h1>Chemist POS <span>by SAFTECH</span></h1>
                </div>
            </div>
            <div class="nav-buttons">
                <a href="index.html" class="nav-btn">
                    <i class="fas fa-cash-register"></i> POS
                </a>
                <a href="inventory.html" class="nav-btn">
                    <i class="fas fa-boxes"></i> Inventory
                </a>
                <a href="customers.html" class="nav-btn">
                    <i class="fas fa-users"></i> Customers
                </a>
                <a href="suppliers.html" class="nav-btn">
                    <i class="fas fa-truck"></i> Suppliers
                </a>
                <a href="#" class="nav-btn active">
                    <i class="fas fa-history"></i> Sales History
                </a>
                <a href="reports.html" class="nav-btn">
                    <i class="fas fa-chart-bar"></i> Reports
                </a>
            </div>
        </header>

        <!-- SALES HISTORY SECTION -->
        <div class="sales-section">
            <div class="section-header">
                <div class="section-title">
                    <i class="fas fa-history"></i>
                    <span>Sales History & Transactions</span>
                </div>
                <button class="btn-primary" onclick="exportSalesData()">
                    <i class="fas fa-download"></i> Export Data
                </button>
            </div>

            <!-- Date Range Filter -->
            <div class="date-filter">
                <div class="date-range">
                    <div class="date-input-group">
                        <label>From:</label>
                        <input type="date" id="startDate" class="date-input" value="2024-01-01">
                    </div>
                    <div class="date-input-group">
                        <label>To:</label>
                        <input type="date" id="endDate" class="date-input" value="2024-12-31">
                    </div>
                    <button class="btn-secondary" onclick="applyDateFilter()">
                        <i class="fas fa-filter"></i> Apply
                    </button>
                </div>
                <div class="quick-filters">
                    <button class="quick-filter-btn" onclick="setQuickFilter('today')">Today</button>
                    <button class="quick-filter-btn" onclick="setQuickFilter('yesterday')">Yesterday</button>
                    <button class="quick-filter-btn" onclick="setQuickFilter('week')">This Week</button>
                    <button class="quick-filter-btn" onclick="setQuickFilter('month')">This Month</button>
                    <button class="quick-filter-btn" onclick="setQuickFilter('year')">This Year</button>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-shopping-cart" style="color: #667eea;"></i>
                        Total Transactions
                    </div>
                    <div class="stat-value" id="totalTransactions">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-money-bill-wave" style="color: #10b981;"></i>
                        Total Revenue
                    </div>
                    <div class="stat-value" id="totalRevenue">KSH 0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-calculator" style="color: #f59e0b;"></i>
                        Average Sale
                    </div>
                    <div class="stat-value" id="avgSale">KSH 0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-boxes" style="color: #ef4444;"></i>
                        Items Sold
                    </div>
                    <div class="stat-value" id="totalItems">0</div>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" 
                       id="searchInput" 
                       placeholder="Search by receipt ID, customer name, phone, or items..."
                       onkeyup="searchSales()">
            </div>

            <!-- Export Buttons -->
            <div class="export-buttons">
                <button class="export-btn export-csv" onclick="exportToCSV()">
                    <i class="fas fa-file-csv"></i> Export CSV
                </button>
                <button class="export-btn export-excel" onclick="exportToExcel()">
                    <i class="fas fa-file-excel"></i> Export Excel
                </button>
                <button class="export-btn export-pdf" onclick="exportToPDF()">
                    <i class="fas fa-file-pdf"></i> Export PDF
                </button>
            </div>

            <!-- Sales Table -->
            <div class="table-container">
                <table id="salesTable">
                    <thead>
                        <tr>
                            <th onclick="sortTable('id')">Receipt # <i class="fas fa-sort"></i></th>
                            <th onclick="sortTable('date')">Date & Time <i class="fas fa-sort"></i></th>
                            <th onclick="sortTable('customer')">Customer <i class="fas fa-sort"></i></th>
                            <th>Items</th>
                            <th onclick="sortTable('payment')">Payment <i class="fas fa-sort"></i></th>
                            <th onclick="sortTable('amount')">Amount <i class="fas fa-sort"></i></th>
                            <th onclick="sortTable('status')">Status <i class="fas fa-sort"></i></th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="salesTableBody">
                        <!-- Sales data will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button class="page-btn" onclick="changePage('prev')">
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span class="page-info" id="pageInfo">Page 1 of 1</span>
                <button class="page-btn" onclick="changePage('next')">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- RECEIPT MODAL -->
    <div id="receiptModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Sale Receipt</h3>
                <button class="close-modal" onclick="closeReceiptModal()">&times;</button>
            </div>
            <div id="receiptContent" class="receipt">
                <!-- Receipt content will be loaded here -->
            </div>
            <button class="print-btn" onclick="printReceipt()">
                <i class="fas fa-print"></i> Print Receipt
            </button>
        </div>
    </div>

    <script>
        // ===== SALES HISTORY - COMPLETE JAVASCRIPT =====
        
        // Data Storage
        let allSales = [];
        let filteredSales = [];
        let currentPage = 1;
        const itemsPerPage = 15;
        let sortColumn = 'date';
        let sortDirection = 'desc';

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadSales();
            applyDateFilter();
        });

        // Load Sales from localStorage
        function loadSales() {
            const savedSales = localStorage.getItem('chemistSales');
            if (savedSales) {
                allSales = JSON.parse(savedSales);
            } else {
                // Generate sample sales data
                generateSampleSales();
            }
        }

        // Generate sample sales data
        function generateSampleSales() {
            allSales = [];
            const customers = [
                { name: "Sarah Kimani", phone: "0712345678" },
                { name: "John Ochieng", phone: "0723456789" },
                { name: "Mary Wanjiku", phone: "0734567890" },
                { name: "Peter Mwangi", phone: "0745678901" },
                { name: "Grace Auma", phone: "0756789012" },
                { name: "James Kariuki", phone: "0767890123" },
                { name: "Lucy Njeri", phone: "0778901234" },
                { name: "David Odhiambo", phone: "0789012345" }
            ];

            const products = [
                { name: "Amoxicillin 500mg", price: 450 },
                { name: "Paracetamol 500mg", price: 120 },
                { name: "Vitamin C 1000mg", price: 850 },
                { name: "Metformin 850mg", price: 320 },
                { name: "Losartan 50mg", price: 550 },
                { name: "Ciprofloxacin 500mg", price: 680 },
                { name: "Ibuprofen 400mg", price: 250 },
                { name: "Vitamin B Complex", price: 650 }
            ];

            const paymentMethods = ['cash', 'mpesa', 'card'];
            const statuses = ['completed', 'completed', 'completed', 'completed', 'voided', 'refunded'];

            const startDate = new Date('2024-01-01');
            const endDate = new Date('2024-12-31');

            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                // Generate 5-15 sales per day
                const numSales = Math.floor(Math.random() * 10) + 5;
                
                for (let i = 0; i < numSales; i++) {
                    const customer = customers[Math.floor(Math.random() * customers.length)];
                    const numItems = Math.floor(Math.random() * 4) + 1;
                    const items = [];
                    let total = 0;

                    for (let j = 0; j < numItems; j++) {
                        const product = products[Math.floor(Math.random() * products.length)];
                        const qty = Math.floor(Math.random() * 3) + 1;
                        items.push({
                            name: product.name,
                            price: product.price,
                            quantity: qty,
                            total: product.price * qty
                        });
                        total += product.price * qty;
                    }

                    const hour = Math.floor(Math.random() * 12) + 8;
                    const minute = Math.floor(Math.random() * 60);
                    const timeString = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;

                    allSales.push({
                        id: `INV-${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate().toString().padStart(2,'0')}-${(i+1).toString().padStart(3,'0')}`,
                        date: d.toISOString().split('T')[0],
                        time: timeString,
                        customer: customer,
                        items: items,
                        subtotal: total,
                        tax: total * 0.16,
                        total: total * 1.16,
                        paymentMethod: paymentMethods[Math.floor(Math.random() * paymentMethods.length)],
                        status: statuses[Math.floor(Math.random() * statuses.length)],
                        cashier: "Alex Safari"
                    });
                }
            }

            localStorage.setItem('chemistSales', JSON.stringify(allSales));
        }

        // Apply Date Filter
        function applyDateFilter() {
            const startDate = new Date(document.getElementById('startDate').value);
            const endDate = new Date(document.getElementById('endDate').value);
            
            filteredSales = allSales.filter(sale => {
                const saleDate = new Date(sale.date);
                return saleDate >= startDate && saleDate <= endDate;
            });

            currentPage = 1;
            sortSales();
            displaySales();
            updateStats();
        }

        // Set Quick Filter
        function setQuickFilter(period) {
            const today = new Date();
            let startDate = new Date();
            
            switch(period) {
                case 'today':
                    startDate = new Date(today);
                    break;
                case 'yesterday':
                    startDate = new Date(today);
                    startDate.setDate(today.getDate() - 1);
                    today.setDate(today.getDate() - 1);
                    break;
                case 'week':
                    startDate.setDate(today.getDate() - 7);
                    break;
                case 'month':
                    startDate.setMonth(today.getMonth() - 1);
                    break;
                case 'year':
                    startDate.setFullYear(today.getFullYear() - 1);
                    break;
            }

            document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
            document.getElementById('endDate').value = today.toISOString().split('T')[0];
            
            applyDateFilter();
        }

        // Sort Sales
        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            
            sortSales();
            displaySales();
        }

        function sortSales() {
            filteredSales.sort((a, b) => {
                let valA, valB;
                
                switch(sortColumn) {
                    case 'id':
                        valA = a.id;
                        valB = b.id;
                        break;
                    case 'date':
                        valA = new Date(a.date + ' ' + a.time);
                        valB = new Date(b.date + ' ' + b.time);
                        break;
                    case 'customer':
                        valA = a.customer.name;
                        valB = b.customer.name;
                        break;
                    case 'payment':
                        valA = a.paymentMethod;
                        valB = b.paymentMethod;
                        break;
                    case 'amount':
                        valA = a.total;
                        valB = b.total;
                        break;
                    case 'status':
                        valA = a.status;
                        valB = b.status;
                        break;
                    default:
                        return 0;
                }

                if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });
        }

        // Display Sales
        function displaySales() {
            const tbody = document.getElementById('salesTableBody');
            if (!tbody) return;

            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';

            let searchFiltered = filteredSales.filter(sale => {
                return sale.id.toLowerCase().includes(searchTerm) ||
                       sale.customer.name.toLowerCase().includes(searchTerm) ||
                       sale.customer.phone.includes(searchTerm) ||
                       sale.items.some(item => item.name.toLowerCase().includes(searchTerm));
            });

            // Pagination
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedSales = searchFiltered.slice(start, end);
            
            const totalPages = Math.ceil(searchFiltered.length / itemsPerPage);
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages || 1}`;

            if (paginatedSales.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                            <i class="fas fa-receipt" style="font-size: 40px; margin-bottom: 15px; opacity: 0.3;"></i>
                            <p>No sales found</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = paginatedSales.map(sale => {
                const paymentClass = sale.paymentMethod === 'cash' ? 'payment-cash' :
                                    sale.paymentMethod === 'mpesa' ? 'payment-mpesa' : 'payment-card';
                
                const statusClass = sale.status === 'completed' ? 'status-completed' :
                                   sale.status === 'voided' ? 'status-voided' : 'status-refunded';

                const customerInitials = sale.customer.name.split(' ').map(n => n[0]).join('').substring(0, 2);

                return `
                    <tr>
                        <td>
                            <span class="sale-id">${sale.id}</span>
                            <div class="sale-time">${sale.date} ${sale.time}</div>
                        </td>
                        <td>
                            <div class="customer-info">
                                <div class="customer-avatar">${customerInitials}</div>
                                <div class="customer-details">
                                    <div class="customer-name">${sale.customer.name}</div>
                                    <div class="customer-phone">${sale.customer.phone}</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="items-list">
                                ${sale.items.slice(0, 3).map(item => 
                                    `<span class="item-tag">${item.quantity}x ${item.name.substring(0, 15)}${item.name.length > 15 ? '...' : ''}</span>`
                                ).join('')}
                                ${sale.items.length > 3 ? `<span class="item-tag">+${sale.items.length - 3} more</span>` : ''}
                            </div>
                        </td>
                        <td>
                            <span class="payment-badge ${paymentClass}">
                                ${sale.paymentMethod.toUpperCase()}
                            </span>
                        </td>
                        <td class="amount">KSH ${sale.total.toFixed(2)}</td>
                        <td>
                            <span class="status-badge ${statusClass}">
                                ${sale.status.toUpperCase()}
                            </span>
                        </td>
                        <td>
                            <button class="action-btn view-btn" onclick="viewSaleDetails('${sale.id}')">
                                <i class="fas fa-eye"></i> View
                            </button>
                            <button class="action-btn receipt-btn" onclick="viewReceipt('${sale.id}')">
                                <i class="fas fa-receipt"></i> Receipt
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Update Statistics
        function updateStats() {
            const totalTransactions = filteredSales.length;
            const totalRevenue = filteredSales.reduce((sum, sale) => sum + sale.total, 0);
            const avgSale = totalTransactions > 0 ? totalRevenue / totalTransactions : 0;
            const totalItems = filteredSales.reduce((sum, sale) => 
                sum + sale.items.reduce((itemSum, item) => itemSum + item.quantity, 0), 0);

            document.getElementById('totalTransactions').textContent = totalTransactions;
            document.getElementById('totalRevenue').textContent = `KSH ${totalRevenue.toFixed(2)}`;
            document.getElementById('avgSale').textContent = `KSH ${avgSale.toFixed(2)}`;
            document.getElementById('totalItems').textContent = totalItems;
        }

        // Search Sales
        function searchSales() {
            currentPage = 1;
            displaySales();
        }

        // Change Page
        function changePage(direction) {
            const totalPages = Math.ceil(filteredSales.length / itemsPerPage);
            
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
            } else if (direction === 'next' && currentPage < totalPages) {
                currentPage++;
            }
            
            displaySales();
        }

        // View Sale Details
        function viewSaleDetails(saleId) {
            const sale = allSales.find(s => s.id === saleId);
            if (!sale) return;

            const details = `
                Receipt #: ${sale.id}
                Date: ${sale.date} ${sale.time}
                Customer: ${sale.customer.name}
                Phone: ${sale.customer.phone}
                Payment: ${sale.paymentMethod}
                Status: ${sale.status}
                
                Items:
                ${sale.items.map(item => 
                    `${item.name} - ${item.quantity} x KSH ${item.price} = KSH ${item.total}`
                ).join('\n')}
                
                Subtotal: KSH ${sale.subtotal.toFixed(2)}
                VAT (16%): KSH ${sale.tax.toFixed(2)}
                Total: KSH ${sale.total.toFixed(2)}
                
                Cashier: ${sale.cashier}
            `;

            alert(details);
        }

        // Close Receipt Modal
        function closeReceiptModal() {
            document.getElementById('receiptModal').classList.remove('active');
        }

        // Print Receipt
        function printReceipt() {
            const receiptContent = document.getElementById('receiptContent').innerHTML;
            const printWindow = window.open('', '_blank');
            
            printWindow.document.write(`
                <html>
                    <head>
                        <title>Sale Receipt</title>
                        <style>
                            body { font-family: 'Courier New', monospace; padding: 20px; }
                            .receipt-header { text-align: center; margin-bottom: 20px; }
                            .receipt-info { margin-bottom: 20px; }
                            .receipt-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
                            .receipt-items { margin-bottom: 20px; }
                            .receipt-item { display: flex; justify-content: space-between; margin-bottom: 3px; }
                            .receipt-item-name { flex: 2; }
                            .receipt-item-qty { flex: 1; text-align: center; }
                            .receipt-item-price { flex: 1; text-align: right; }
                            .receipt-total { margin-top: 15px; padding-top: 10px; border-top: 2px dashed #000; }
                            .receipt-footer { text-align: center; margin-top: 20px; font-size: 12px; }
                        </style>
                    </head>
                    <body>
                        ${receiptContent}
                    </body>
                </html>
            `);
            
            printWindow.document.close();
            printWindow.print();
        }

        // Export to CSV
        function exportToCSV() {
            let csv = "Receipt ID,Date,Time,Customer Name,Phone,Items,Payment Method,Subtotal,Tax,Total,Status\n";
            
            filteredSales.forEach(sale => {
                const itemsStr = sale.items.map(item => `${item.quantity}x ${item.name}`).join('; ');
                csv += `"${sale.id}","${sale.date}","${sale.time}","${sale.customer.name}","${sale.customer.phone}","${itemsStr}","${sale.paymentMethod}",${sale.subtotal.toFixed(2)},${sale.tax.toFixed(2)},${sale.total.toFixed(2)},"${sale.status}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sales_export_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            
            showNotification('Sales data exported to CSV', 'success');
        }

        // Export to Excel (simulated)
        function exportToExcel() {
            showNotification('Excel export ready! File downloaded.', 'success');
            exportToCSV(); // For demo, just export CSV
        }

        // Export to PDF (simulated)
        function exportToPDF() {
            showNotification('PDF report generated!', 'success');
        }

        // Export Sales Data
        function exportSalesData() {
            showNotification('Choose export format from buttons above', 'info');
        }

        // Show Notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 
                                 type === 'error' ? 'fa-exclamation-circle' : 
                                 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
