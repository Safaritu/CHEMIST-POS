<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemist POS - Customer Management</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: #667eea;
            font-size: 14px;
            font-weight: 400;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn.active {
            background: #667eea;
            color: white;
        }

        .nav-btn:not(.active) {
            background: #f3f4f6;
            color: #4b5563;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* ===== CUSTOMERS SECTION ===== */
        .customers-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #4b5563;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
        }

        .stat-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        /* ===== SEARCH BAR ===== */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .search-box input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* ===== CUSTOMER CARDS GRID ===== */
        .customers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .customer-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
        }

        .customer-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .customer-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .customer-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .customer-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-regular {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-vip {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-new {
            background: #dbeafe;
            color: #1e40af;
        }

        .customer-info {
            margin-bottom: 15px;
        }

        .customer-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .customer-contact {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .customer-contact i {
            width: 20px;
            color: #667eea;
        }

        .customer-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            padding: 15px 0;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }

        .customer-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #3b82f6;
        }

        .edit-btn:hover {
            background: #3b82f6;
            color: white;
        }

        .history-btn {
            background: #e0e7ff;
            color: #4f46e5;
        }

        .history-btn:hover {
            background: #4f46e5;
            color: white;
        }

        .delete-btn {
            background: #fee2e2;
            color: #ef4444;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: white;
        }

        /* ===== QUICK ADD FORM ===== */
        .quick-add-form {
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px dashed #667eea;
        }

        .form-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }

        /* ===== PURCHASE HISTORY MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .purchase-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .purchase-date {
            font-size: 14px;
            color: #666;
        }

        .purchase-amount {
            font-weight: 700;
            color: #667eea;
        }

        .purchase-items {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification.success { border-left: 4px solid #10b981; }
        .notification.error { border-left: 4px solid #ef4444; }
        .notification.info { border-left: 4px solid #3b82f6; }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .nav-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .customers-grid {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .customer-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-clinic-medical"></i>
                </div>
                <div>
                    <h1>Chemist POS <span>by SAFTECH</span></h1>
                </div>
            </div>
            <div class="nav-buttons">
                <a href="index.html" class="nav-btn">
                    <i class="fas fa-cash-register"></i> POS
                </a>
                <a href="inventory.html" class="nav-btn">
                    <i class="fas fa-boxes"></i> Inventory
                </a>
                <a href="#" class="nav-btn active">
                    <i class="fas fa-users"></i> Customers
                </a>
                <a href="#" class="nav-btn" onclick="showNotification('Reports page coming soon!', 'info')">
                    <i class="fas fa-chart-bar"></i> Reports
                </a>
            </div>
        </header>

        <!-- CUSTOMERS SECTION -->
        <div class="customers-section">
            <div class="section-header">
                <div class="section-title">
                    <i class="fas fa-users"></i>
                    <span>Customer Management</span>
                </div>
                <button class="btn-primary" onclick="showQuickAddForm()">
                    <i class="fas fa-user-plus"></i> Add New Customer
                </button>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-users" style="color: #667eea;"></i>
                        Total Customers
                    </div>
                    <div class="stat-value" id="totalCustomers">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-crown" style="color: #f59e0b;"></i>
                        VIP Customers
                    </div>
                    <div class="stat-value" id="vipCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-shopping-cart" style="color: #10b981;"></i>
                        Total Purchases
                    </div>
                    <div class="stat-value" id="totalPurchases">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-calendar-plus" style="color: #3b82f6;"></i>
                        New This Month
                    </div>
                    <div class="stat-value" id="newThisMonth">0</div>
                </div>
            </div>

            <!-- Quick Add Form (Hidden by default) -->
            <div id="quickAddForm" class="quick-add-form" style="display: none;">
                <div class="form-title">
                    <i class="fas fa-user-plus"></i> Add New Customer
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" id="newCustomerName" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" id="newCustomerPhone" class="form-control" placeholder="07XX XXX XXX">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="newCustomerEmail" class="form-control" placeholder="customer@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Customer Type</label>
                        <select id="newCustomerType" class="form-control">
                            <option value="regular">Regular</option>
                            <option value="vip">VIP</option>
                            <option value="new">New</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Address (Optional)</label>
                    <input type="text" id="newCustomerAddress" class="form-control" placeholder="Nairobi, Kenya">
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button class="btn-secondary" onclick="hideQuickAddForm()">Cancel</button>
                    <button class="btn-primary" onclick="addCustomer()">Save Customer</button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" 
                       id="searchInput" 
                       placeholder="Search customers by name, phone, or email..."
                       onkeyup="searchCustomers()">
            </div>

            <!-- Filter Tabs -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="filter-tab" style="padding: 8px 16px; border: none; background: #f3f4f6; border-radius: 30px; cursor: pointer;" onclick="filterCustomers('all')">
                    <i class="fas fa-border-all"></i> All
                </button>
                <button class="filter-tab" style="padding: 8px 16px; border: none; background: #f3f4f6; border-radius: 30px; cursor: pointer;" onclick="filterCustomers('vip')">
                    <i class="fas fa-crown"></i> VIP
                </button>
                <button class="filter-tab" style="padding: 8px 16px; border: none; background: #f3f4f6; border-radius: 30px; cursor: pointer;" onclick="filterCustomers('regular')">
                    <i class="fas fa-user"></i> Regular
                </button>
                <button class="filter-tab" style="padding: 8px 16px; border: none; background: #f3f4f6; border-radius: 30px; cursor: pointer;" onclick="filterCustomers('new')">
                    <i class="fas fa-star"></i> New
                </button>
            </div>

            <!-- Customers Grid -->
            <div id="customersGrid" class="customers-grid">
                <!-- Customers will be loaded here -->
            </div>
        </div>
    </div>

    <!-- PURCHASE HISTORY MODAL -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="historyModalTitle">Purchase History</h3>
                <button class="close-modal" onclick="closeHistoryModal()">&times;</button>
            </div>
            <div id="purchaseHistoryList">
                <!-- Purchase history will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // ===== CUSTOMER MANAGEMENT - COMPLETE JAVASCRIPT =====
        
        // Data Storage
        let customers = [];
        let purchases = [];

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadCustomers();
            loadPurchases();
            displayCustomers();
            updateStats();
        });

        // Load Customers (from localStorage or sample data)
        function loadCustomers() {
            const savedCustomers = localStorage.getItem('chemistCustomers');
            if (savedCustomers) {
                customers = JSON.parse(savedCustomers);
            } else {
                // Sample customers
                customers = [
                    {
                        id: 1,
                        name: "Sarah Kimani",
                        phone: "0712345678",
                        email: "sarah.k@email.com",
                        address: "Nairobi",
                        type: "vip",
                        totalPurchases: 24,
                        totalSpent: 45800,
                        lastPurchase: "2024-01-15",
                        joined: "2023-01-10"
                    },
                    {
                        id: 2,
                        name: "John Ochieng",
                        phone: "0723456789",
                        email: "john.o@email.com",
                        address: "Kisumu",
                        type: "regular",
                        totalPurchases: 8,
                        totalSpent: 12500,
                        lastPurchase: "2024-01-10",
                        joined: "2023-08-22"
                    },
                    {
                        id: 3,
                        name: "Mary Wanjiku",
                        phone: "0734567890",
                        email: "mary.w@email.com",
                        address: "Mombasa",
                        type: "vip",
                        totalPurchases: 31,
                        totalSpent: 67200,
                        lastPurchase: "2024-01-18",
                        joined: "2022-11-05"
                    },
                    {
                        id: 4,
                        name: "Peter Mwangi",
                        phone: "0745678901",
                        email: "peter.m@email.com",
                        address: "Nakuru",
                        type: "new",
                        totalPurchases: 2,
                        totalSpent: 3400,
                        lastPurchase: "2024-01-20",
                        joined: "2024-01-15"
                    },
                    {
                        id: 5,
                        name: "Grace Auma",
                        phone: "0756789012",
                        email: "grace.a@email.com",
                        address: "Eldoret",
                        type: "regular",
                        totalPurchases: 12,
                        totalSpent: 18900,
                        lastPurchase: "2024-01-12",
                        joined: "2023-05-18"
                    }
                ];
                saveToLocalStorage();
            }
        }

        // Load Purchases (sample data for history)
        function loadPurchases() {
            const savedPurchases = localStorage.getItem('chemistPurchases');
            if (savedPurchases) {
                purchases = JSON.parse(savedPurchases);
            } else {
                purchases = [
                    { customerId: 1, date: "2024-01-15", amount: 3500, items: ["Amoxicillin", "Vitamin C"] },
                    { customerId: 1, date: "2024-01-10", amount: 2800, items: ["Paracetamol", "Ibuprofen"] },
                    { customerId: 1, date: "2024-01-05", amount: 4200, items: ["Metformin", "Losartan"] },
                    { customerId: 2, date: "2024-01-10", amount: 1800, items: ["Vitamin C"] },
                    { customerId: 3, date: "2024-01-18", amount: 5600, items: ["Amoxicillin", "Ciprofloxacin"] },
                    { customerId: 4, date: "2024-01-20", amount: 2200, items: ["Paracetamol"] }
                ];
                localStorage.setItem('chemistPurchases', JSON.stringify(purchases));
            }
        }

        // Save to localStorage
        function saveToLocalStorage() {
            localStorage.setItem('chemistCustomers', JSON.stringify(customers));
        }

        // Display Customers
        function displayCustomers() {
            const grid = document.getElementById('customersGrid');
            if (!grid) return;

            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const activeFilter = document.querySelector('.filter-tab.active')?.dataset.filter || 'all';

            let filteredCustomers = customers.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(searchTerm) ||
                                     c.phone.includes(searchTerm) ||
                                     (c.email && c.email.toLowerCase().includes(searchTerm));
                
                if (!matchesSearch) return false;

                if (activeFilter !== 'all') {
                    return c.type === activeFilter;
                }
                return true;
            });

            if (filteredCustomers.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #999;">
                        <i class="fas fa-users" style="font-size: 60px; margin-bottom: 20px; opacity: 0.3;"></i>
                        <p style="font-size: 18px;">No customers found</p>
                        <p style="font-size: 14px; margin-top: 10px;">Click "Add New Customer" to get started</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredCustomers.map(customer => {
                const badgeClass = customer.type === 'vip' ? 'badge-vip' : 
                                  customer.type === 'new' ? 'badge-new' : 'badge-regular';
                const badgeText = customer.type === 'vip' ? 'VIP' : 
                                 customer.type === 'new' ? 'New' : 'Regular';
                const initials = customer.name.split(' ').map(n => n[0]).join('').substring(0, 2);

                return `
                    <div class="customer-card">
                        <div class="customer-header">
                            <div class="customer-avatar">${initials}</div>
                            <span class="customer-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="customer-info">
                            <div class="customer-name">${customer.name}</div>
                            <div class="customer-contact">
                                <i class="fas fa-phone"></i> ${customer.phone}
                            </div>
                            ${customer.email ? `
                                <div class="customer-contact">
                                    <i class="fas fa-envelope"></i> ${customer.email}
                                </div>
                            ` : ''}
                            ${customer.address ? `
                                <div class="customer-contact">
                                    <i class="fas fa-map-marker-alt"></i> ${customer.address}
                                </div>
                            ` : ''}
                        </div>
                        <div class="customer-stats">
                            <div class="stat-item">
                                <div class="label">Purchases</div>
                                <div class="value">${customer.totalPurchases || 0}</div>
                            </div>
                            <div class="stat-item">
                                <div class="label">Total Spent</div>
                                <div class="value">KSH ${(customer.totalSpent || 0).toLocaleString()}</div>
                            </div>
                        </div>
                        <div style="font-size: 12px; color: #666; text-align: center; margin-bottom: 10px;">
                            Last purchase: ${customer.lastPurchase || 'Never'}
                        </div>
                        <div class="customer-actions">
                            <button class="action-btn edit-btn" onclick="editCustomer(${customer.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="action-btn history-btn" onclick="viewHistory(${customer.id})">
                                <i class="fas fa-history"></i> History
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteCustomer(${customer.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update Statistics
        function updateStats() {
            const total = customers.length;
            const vip = customers.filter(c => c.type === 'vip').length;
            const totalPurchases = customers.reduce((sum, c) => sum + (c.totalPurchases || 0), 0);
            
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();
            const newThisMonth = customers.filter(c => {
                const joined = new Date(c.joined);
                return joined.getMonth() === currentMonth && joined.getFullYear() === currentYear;
            }).length;

            document.getElementById('totalCustomers').textContent = total;
            document.getElementById('vipCount').textContent = vip;
            document.getElementById('totalPurchases').textContent = totalPurchases;
            document.getElementById('newThisMonth').textContent = newThisMonth;
        }

        // Search Customers
        function searchCustomers() {
            displayCustomers();
        }

        // Filter Customers
        function filterCustomers(type) {
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.style.background = '#f3f4f6';
                btn.style.color = '#4b5563';
            });
            event.target.style.background = '#667eea';
            event.target.style.color = 'white';
            event.target.dataset.filter = type;
            displayCustomers();
        }

        // Show Quick Add Form
        function showQuickAddForm() {
            document.getElementById('quickAddForm').style.display = 'block';
        }

        // Hide Quick Add Form
        function hideQuickAddForm() {
            document.getElementById('quickAddForm').style.display = 'none';
            document.getElementById('newCustomerName').value = '';
            document.getElementById('newCustomerPhone').value = '';
            document.getElementById('newCustomerEmail').value = '';
            document.getElementById('newCustomerAddress').value = '';
        }

        // Add Customer
        function addCustomer() {
            const name = document.getElementById('newCustomerName').value.trim();
            const phone = document.getElementById('newCustomerPhone').value.trim();
            const email = document.getElementById('newCustomerEmail').value.trim();
            const address = document.getElementById('newCustomerAddress').value.trim();
            const type = document.getElementById('newCustomerType').value;

            if (!name || !phone) {
                showNotification('Name and phone are required!', 'error');
                return;
            }

            const newCustomer = {
                id: customers.length > 0 ? Math.max(...customers.map(c => c.id)) + 1 : 1,
                name: name,
                phone: phone,
                email: email || '',
                address: address || '',
                type: type,
                totalPurchases: 0,
                totalSpent: 0,
                lastPurchase: null,
                joined: new Date().toISOString().split('T')[0]
            };

            customers.push(newCustomer);
            saveToLocalStorage();
            hideQuickAddForm();
            displayCustomers();
            updateStats();
            showNotification('Customer added successfully!', 'success');
        }

        // Edit Customer
        function editCustomer(id) {
            const customer = customers.find(c => c.id === id);
            if (!customer) return;

            // Simple prompt-based edit for now
            const newName = prompt('Enter customer name:', customer.name);
            if (newName) {
                customer.name = newName;
            }
            
            const newPhone = prompt('Enter phone number:', customer.phone);
            if (newPhone) {
                customer.phone = newPhone;
            }
            
            saveToLocalStorage();
            displayCustomers();
            showNotification('Customer updated!', 'success');
        }

        // View Purchase History
        function viewHistory(customerId) {
            const customer = customers.find(c => c.id === customerId);
            if (!customer) return;

            const customerPurchases = purchases.filter(p => p.customerId === customerId);
            
            document.getElementById('historyModalTitle').textContent = `${customer.name}'s Purchase History`;
            
            const historyList = document.getElementById('purchaseHistoryList');
            
            if (customerPurchases.length === 0) {
                historyList.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <i class="fas fa-history" style="font-size: 40px; margin-bottom: 15px; opacity: 0.3;"></i>
                        <p>No purchase history yet</p>
                    </div>
                `;
            } else {
                historyList.innerHTML = customerPurchases.map(p => `
                    <div class="purchase-item">
                        <div>
                            <div class="purchase-date">${formatDate(p.date)}</div>
                            <div class="purchase-items">${p.items.join(', ')}</div>
                        </div>
                        <div class="purchase-amount">KSH ${p.amount}</div>
                    </div>
                `).join('');
            }

            document.getElementById('historyModal').classList.add('active');
        }

        // Close History Modal
        function closeHistoryModal() {
            document.getElementById('historyModal').classList.remove('active');
        }

        // Delete Customer
        function deleteCustomer(id) {
            if (confirm('Are you sure you want to delete this customer?')) {
                customers = customers.filter(c => c.id !== id);
                saveToLocalStorage();
                displayCustomers();
                updateStats();
                showNotification('Customer deleted', 'info');
            }
        }

        // Format Date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-GB', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });
        }

        // Show Notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 
                                 type === 'error' ? 'fa-exclamation-circle' : 
                                 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
