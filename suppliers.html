<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemist POS - Supplier Management</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: #667eea;
            font-size: 14px;
            font-weight: 400;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn.active {
            background: #667eea;
            color: white;
        }

        .nav-btn:not(.active) {
            background: #f3f4f6;
            color: #4b5563;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* ===== SUPPLIERS SECTION ===== */
        .suppliers-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #4b5563;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-success {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-success:hover {
            background: #059669;
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
        }

        .stat-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .stat-value small {
            font-size: 14px;
            color: #666;
            font-weight: 400;
        }

        /* ===== SEARCH BAR ===== */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .search-box input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* ===== FILTER TABS ===== */
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            border: none;
            background: #f3f4f6;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-tab:hover {
            background: #667eea;
            color: white;
        }

        .filter-tab.active {
            background: #667eea;
            color: white;
        }

        /* ===== SUPPLIERS GRID ===== */
        .suppliers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .supplier-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 20px;
            border: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
        }

        .supplier-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .supplier-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .supplier-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .supplier-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-active {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-preferred {
            background: #fef3c7;
            color: #92400e;
        }

        .supplier-info {
            margin-bottom: 15px;
        }

        .supplier-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .supplier-contact {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .supplier-contact i {
            width: 20px;
            color: #667eea;
        }

        /* ===== PRODUCTS SUPPLIED ===== */
        .products-supplied {
            margin: 15px 0;
            padding: 15px 0;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }

        .products-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #4b5563;
        }

        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .product-tag {
            background: #e0e7ff;
            color: #4f46e5;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        /* ===== SUPPLIER STATS ===== */
        .supplier-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .label {
            font-size: 11px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 16px;
            font-weight: 700;
            color: #667eea;
        }

        /* ===== ACTION BUTTONS ===== */
        .supplier-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 13px;
        }

        .view-btn {
            background: #dbeafe;
            color: #3b82f6;
        }

        .view-btn:hover {
            background: #3b82f6;
            color: white;
        }

        .order-btn {
            background: #d1fae5;
            color: #059669;
        }

        .order-btn:hover {
            background: #059669;
            color: white;
        }

        .edit-btn {
            background: #e0e7ff;
            color: #4f46e5;
        }

        .edit-btn:hover {
            background: #4f46e5;
            color: white;
        }

        .delete-btn {
            background: #fee2e2;
            color: #ef4444;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: white;
        }

        /* ===== QUICK ADD FORM ===== */
        .quick-add-form {
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px dashed #667eea;
        }

        .form-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        /* ===== ORDER MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        /* ===== ORDER ITEMS ===== */
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-name {
            font-weight: 600;
        }

        .order-item-price {
            font-size: 12px;
            color: #666;
        }

        .order-item-qty {
            width: 70px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        .order-total {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
            text-align: right;
        }

        .order-total .label {
            font-size: 14px;
            color: #666;
        }

        .order-total .value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-left: 15px;
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification.success { border-left: 4px solid #10b981; }
        .notification.error { border-left: 4px solid #ef4444; }
        .notification.info { border-left: 4px solid #3b82f6; }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .suppliers-grid {
                grid-template-columns: 1fr;
            }
            
            .supplier-actions {
                flex-direction: column;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-clinic-medical"></i>
                </div>
                <div>
                    <h1>Chemist POS <span>by SAFTECH</span></h1>
                </div>
            </div>
            <div class="nav-buttons">
                <a href="index.html" class="nav-btn">
                    <i class="fas fa-cash-register"></i> POS
                </a>
                <a href="inventory.html" class="nav-btn">
                    <i class="fas fa-boxes"></i> Inventory
                </a>
                <a href="customers.html" class="nav-btn">
                    <i class="fas fa-users"></i> Customers
                </a>
                <a href="#" class="nav-btn active">
                    <i class="fas fa-truck"></i> Suppliers
                </a>
                <a href="reports.html" class="nav-btn">
                    <i class="fas fa-chart-bar"></i> Reports
                </a>
            </div>
        </header>

        <!-- SUPPLIERS SECTION -->
        <div class="suppliers-section">
            <div class="section-header">
                <div class="section-title">
                    <i class="fas fa-truck"></i>
                    <span>Supplier Management</span>
                </div>
                <button class="btn-primary" onclick="showQuickAddForm()">
                    <i class="fas fa-plus-circle"></i> Add New Supplier
                </button>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-truck" style="color: #667eea;"></i>
                        Total Suppliers
                    </div>
                    <div class="stat-value" id="totalSuppliers">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-star" style="color: #f59e0b;"></i>
                        Preferred Partners
                    </div>
                    <div class="stat-value" id="preferredSuppliers">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-boxes" style="color: #10b981;"></i>
                        Products Supplied
                    </div>
                    <div class="stat-value" id="totalProductsSupplied">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">
                        <i class="fas fa-clock" style="color: #ef4444;"></i>
                        Pending Orders
                    </div>
                    <div class="stat-value" id="pendingOrders">0 <small>orders</small></div>
                </div>
            </div>

            <!-- Quick Add Form (Hidden by default) -->
            <div id="quickAddForm" class="quick-add-form" style="display: none;">
                <div class="form-title">
                    <i class="fas fa-truck"></i> Add New Supplier
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Company Name *</label>
                        <input type="text" id="supplierCompany" class="form-control" placeholder="Cosmos Pharmaceuticals Ltd">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Contact Person</label>
                        <input type="text" id="supplierContact" class="form-control" placeholder="John Doe">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Phone *</label>
                        <input type="tel" id="supplierPhone" class="form-control" placeholder="07XX XXX XXX">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="supplierEmail" class="form-control" placeholder="info@company.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tax PIN</label>
                        <input type="text" id="supplierTaxPin" class="form-control" placeholder="P051234567X">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Payment Terms</label>
                        <select id="supplierTerms" class="form-control">
                            <option value="30">Net 30 Days</option>
                            <option value="60">Net 60 Days</option>
                            <option value="90">Net 90 Days</option>
                            <option value="cod">Cash on Delivery</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Address</label>
                    <input type="text" id="supplierAddress" class="form-control" placeholder="Nairobi, Kenya">
                </div>
                <div class="form-group">
                    <label class="form-label">Products Supplied (comma separated)</label>
                    <input type="text" id="supplierProducts" class="form-control" placeholder="Amoxicillin, Paracetamol, Vitamins">
                </div>
                <div class="form-group">
                    <label class="form-label">Notes</label>
                    <textarea id="supplierNotes" class="form-control" placeholder="Additional information..."></textarea>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button class="btn-secondary" onclick="hideQuickAddForm()">Cancel</button>
                    <button class="btn-primary" onclick="addSupplier()">Save Supplier</button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" 
                       id="searchInput" 
                       placeholder="Search suppliers by name, contact, or products..."
                       onkeyup="searchSuppliers()">
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" onclick="filterSuppliers('all', this)">
                    <i class="fas fa-border-all"></i> All Suppliers
                </button>
                <button class="filter-tab" data-filter="preferred" onclick="filterSuppliers('preferred', this)">
                    <i class="fas fa-star"></i> Preferred
                </button>
                <button class="filter-tab" data-filter="active" onclick="filterSuppliers('active', this)">
                    <i class="fas fa-check-circle"></i> Active
                </button>
                <button class="filter-tab" data-filter="inactive" onclick="filterSuppliers('inactive', this)">
                    <i class="fas fa-clock"></i> Inactive
                </button>
            </div>

            <!-- Suppliers Grid -->
            <div id="suppliersGrid" class="suppliers-grid">
                <!-- Suppliers will be loaded here -->
            </div>
        </div>
    </div>

    <!-- ORDER MODAL -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="orderModalTitle">Place Order</h3>
                <button class="close-modal" onclick="closeOrderModal()">&times;</button>
            </div>
            <div id="orderForm">
                <div class="form-group">
                    <label class="form-label">Select Product</label>
                    <select id="orderProduct" class="form-control">
                        <!-- Will be populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Quantity</label>
                    <input type="number" id="orderQuantity" class="form-control" value="1" min="1">
                </div>
                <div class="form-group">
                    <label class="form-label">Unit Price (KSH)</label>
                    <input type="number" id="orderPrice" class="form-control" value="0" min="0">
                </div>
                <button class="btn-primary" style="width: 100%;" onclick="addToOrder()">
                    <i class="fas fa-plus"></i> Add to Order
                </button>
                
                <div id="orderItems" style="margin-top: 20px;">
                    <!-- Order items will appear here -->
                </div>
                
                <div class="order-total">
                    <span class="label">Total:</span>
                    <span class="value" id="orderTotal">KSH 0</span>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn-secondary" style="flex: 1;" onclick="closeOrderModal()">Cancel</button>
                    <button class="btn-success" style="flex: 1;" onclick="submitOrder()">
                        <i class="fas fa-check"></i> Submit Order
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== SUPPLIER MANAGEMENT - COMPLETE JAVASCRIPT =====
        
        // Data Storage
        let suppliers = [];
        let orders = [];
        let currentOrder = [];
        let currentSupplierId = null;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadSuppliers();
            loadOrders();
            displaySuppliers();
            updateStats();
        });

        // Load Suppliers (from localStorage or sample data)
        function loadSuppliers() {
            const savedSuppliers = localStorage.getItem('chemistSuppliers');

        // Load Orders
        function loadOrders() {
            const savedOrders = localStorage.getItem('chemistOrders');
            if (savedOrders) {
                orders = JSON.parse(savedOrders);
            } else {
                orders = [];
                localStorage.setItem('chemistOrders', JSON.stringify(orders));
            }
        }

        // Save to localStorage
        function saveToLocalStorage() {
            localStorage.setItem('chemistSuppliers', JSON.stringify(suppliers));
        }

        // Display Suppliers
        function displaySuppliers() {
            const grid = document.getElementById('suppliersGrid');
            if (!grid) return;

            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const activeFilter = document.querySelector('.filter-tab.active')?.dataset.filter || 'all';

            let filteredSuppliers = suppliers.filter(s => {
                const matchesSearch = s.company.toLowerCase().includes(searchTerm) ||
                                     (s.contact && s.contact.toLowerCase().includes(searchTerm)) ||
                                     (s.products && s.products.some(p => p.toLowerCase().includes(searchTerm)));
                
                if (!matchesSearch) return false;

                switch(activeFilter) {
                    case 'preferred':
                        return s.preferred === true;
                    case 'active':
                        return s.status === 'active';
                    case 'inactive':
                        return s.status === 'inactive';
                    default:
                        return true;
                }
            });

            if (filteredSuppliers.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #999;">
                        <i class="fas fa-truck" style="font-size: 60px; margin-bottom: 20px; opacity: 0.3;"></i>
                        <p style="font-size: 18px;">No suppliers found</p>
                        <p style="font-size: 14px; margin-top: 10px;">Click "Add New Supplier" to get started</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredSuppliers.map(supplier => {
                const statusBadge = supplier.status === 'active' ? 'badge-active' : 'badge-inactive';
                const statusText = supplier.status === 'active' ? 'Active' : 'Inactive';
                const initials = supplier.company.split(' ').map(n => n[0]).join('').substring(0, 2);

                return `
                    <div class="supplier-card">
                        <div class="supplier-header">
                            <div class="supplier-avatar">${initials}</div>
                            <div>
                                ${supplier.preferred ? '<span class="supplier-badge badge-preferred"><i class="fas fa-star"></i> Preferred</span>' : ''}
                                <span class="supplier-badge ${statusBadge}">${statusText}</span>
                            </div>
                        </div>
                        <div class="supplier-info">
                            <div class="supplier-name">${supplier.company}</div>
                            ${supplier.contact ? `
                                <div class="supplier-contact">
                                    <i class="fas fa-user"></i> ${supplier.contact}
                                </div>
                            ` : ''}
                            <div class="supplier-contact">
                                <i class="fas fa-phone"></i> ${supplier.phone}
                            </div>
                            ${supplier.email ? `
                                <div class="supplier-contact">
                                    <i class="fas fa-envelope"></i> ${supplier.email}
                                </div>
                            ` : ''}
                            ${supplier.address ? `
                                <div class="supplier-contact">
                                    <i class="fas fa-map-marker-alt"></i> ${supplier.address}
                                </div>
                            ` : ''}
                        </div>

                        <div class="products-supplied">
                            <div class="products-title">
                                <i class="fas fa-boxes"></i> Products Supplied
                            </div>
                            <div class="product-tags">
                                ${supplier.products.map(p => `<span class="product-tag">${p}</span>`).join('')}
                            </div>
                        </div>

                        <div class="supplier-stats">
                            <div class="stat-item">
                                <div class="label">Orders</div>
                                <div class="value">${supplier.totalOrders || 0}</div>
                            </div>
                            <div class="stat-item">
                                <div class="label">Total Spent</div>
                                <div class="value">KSH ${(supplier.totalSpent || 0).toLocaleString()}</div>
                            </div>
                            <div class="stat-item">
                                <div class="label">Terms</div>
                                <div class="value">Net ${supplier.terms}</div>
                            </div>
                        </div>

                        <div class="supplier-actions">
                            <button class="action-btn order-btn" onclick="openOrderModal(${supplier.id})">
                                <i class="fas fa-shopping-cart"></i> Order
                            </button>
                            <button class="action-btn view-btn" onclick="viewSupplierDetails(${supplier.id})">
                                <i class="fas fa-eye"></i> View
                            </button>
                            <button class="action-btn edit-btn" onclick="editSupplier(${supplier.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteSupplier(${supplier.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update Statistics
        function updateStats() {
            const total = suppliers.length;
            const preferred = suppliers.filter(s => s.preferred).length;
            const products = suppliers.reduce((sum, s) => sum + (s.products ? s.products.length : 0), 0);
            const pending = orders.filter(o => o.status === 'pending').length;

            document.getElementById('totalSuppliers').textContent = total;
            document.getElementById('preferredSuppliers').textContent = preferred;
            document.getElementById('totalProductsSupplied').textContent = products;
            document.getElementById('pendingOrders').textContent = pending;
        }

        // Search Suppliers
        function searchSuppliers() {
            displaySuppliers();
        }

        // Filter Suppliers
        function filterSuppliers(filter, element) {
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');
            element.dataset.filter = filter;
            displaySuppliers();
        }

        // Show Quick Add Form
        function showQuickAddForm() {
            document.getElementById('quickAddForm').style.display = 'block';
        }

        // Hide Quick Add Form
        function hideQuickAddForm() {
            document.getElementById('quickAddForm').style.display = 'none';
            // Clear form
            document.getElementById('supplierCompany').value = '';
            document.getElementById('supplierContact').value = '';
            document.getElementById('supplierPhone').value = '';
            document.getElementById('supplierEmail').value = '';
            document.getElementById('supplierTaxPin').value = '';
            document.getElementById('supplierAddress').value = '';
            document.getElementById('supplierProducts').value = '';
            document.getElementById('supplierNotes').value = '';
        }

        // Add Supplier
        function addSupplier() {
            const company = document.getElementById('supplierCompany').value.trim();
            const phone = document.getElementById('supplierPhone').value.trim();

            if (!company || !phone) {
                showNotification('Company name and phone are required!', 'error');
                return;
            }

            const productsInput = document.getElementById('supplierProducts').value;
            const productsArray = productsInput ? productsInput.split(',').map(p => p.trim()) : [];

            const newSupplier = {
                id: suppliers.length > 0 ? Math.max(...suppliers.map(s => s.id)) + 1 : 1,
                company: company,
                contact: document.getElementById('supplierContact').value.trim(),
                phone: phone,
                email: document.getElementById('supplierEmail').value.trim(),
                taxPin: document.getElementById('supplierTaxPin').value.trim(),
                terms: document.getElementById('supplierTerms').value,
                address: document.getElementById('supplierAddress').value.trim(),
                products: productsArray,
                status: 'active',
                preferred: false,
                notes: document.getElementById('supplierNotes').value.trim(),
                lastOrder: null,
                totalOrders: 0,
                totalSpent: 0
            };

            suppliers.push(newSupplier);
            saveToLocalStorage();
            hideQuickAddForm();
            displaySuppliers();
            updateStats();
            showNotification('Supplier added successfully!', 'success');
        }

        // Open Order Modal
        function openOrderModal(supplierId) {
            currentSupplierId = supplierId;
            currentOrder = [];
            
            const supplier = suppliers.find(s => s.id === supplierId);
            if (!supplier) return;

            document.getElementById('orderModalTitle').textContent = `Place Order - ${supplier.company}`;
            
            // Populate products dropdown
            const productSelect = document.getElementById('orderProduct');
            productSelect.innerHTML = supplier.products.map(p => 
                `<option value="${p}">${p}</option>`
            ).join('');
            
            document.getElementById('orderItems').innerHTML = '';
            document.getElementById('orderTotal').textContent = 'KSH 0';
            document.getElementById('orderModal').classList.add('active');
        }

        // Close Order Modal
        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('active');
            currentOrder = [];
            currentSupplierId = null;
        }

        // Add to Order
        function addToOrder() {
            const product = document.getElementById('orderProduct').value;
            const quantity = parseInt(document.getElementById('orderQuantity').value);
            const price = parseFloat(document.getElementById('orderPrice').value);

            if (quantity <= 0 || price <= 0) {
                showNotification('Please enter valid quantity and price', 'error');
                return;
            }

            const existingItem = currentOrder.find(item => item.product === product);
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                currentOrder.push({
                    product: product,
                    quantity: quantity,
                    price: price
                });
            }

            displayOrderItems();
            document.getElementById('orderQuantity').value = 1;
            document.getElementById('orderPrice').value = 0;
        }

        // Display Order Items
        function displayOrderItems() {
            const container = document.getElementById('orderItems');
            let total = 0;

            container.innerHTML = currentOrder.map((item, index) => {
                const itemTotal = item.quantity * item.price;
                total += itemTotal;
                return `
                    <div class="order-item">
                        <div class="order-item-info">
                            <div class="order-item-name">${item.product}</div>
                            <div class="order-item-price">KSH ${item.price} x ${item.quantity}</div>
                        </div>
                        <div>
                            <span style="font-weight: 700; color: #667eea;">KSH ${itemTotal}</span>
                            <button onclick="removeOrderItem(${index})" style="background: none; border: none; color: #ef4444; margin-left: 10px;">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('orderTotal').textContent = `KSH ${total}`;
        }

        // Remove Order Item
        function removeOrderItem(index) {
            currentOrder.splice(index, 1);
            displayOrderItems();
        }

        // Submit Order
        function submitOrder() {
            if (currentOrder.length === 0) {
                showNotification('Add at least one item to order', 'error');
                return;
            }

            const total = currentOrder.reduce((sum, item) => sum + (item.quantity * item.price), 0);
            
            const newOrder = {
                id: orders.length + 1,
                supplierId: currentSupplierId,
                date: new Date().toISOString().split('T')[0],
                items: currentOrder,
                total: total,
                status: 'pending'
            };

            orders.push(newOrder);
            localStorage.setItem('chemistOrders', JSON.stringify(orders));

            // Update supplier stats
            const supplier = suppliers.find(s => s.id === currentSupplierId);
            if (supplier) {
                supplier.totalOrders = (supplier.totalOrders || 0) + 1;
                supplier.totalSpent = (supplier.totalSpent || 0) + total;
                supplier.lastOrder = new Date().toISOString().split('T')[0];
                saveToLocalStorage();
            }

            showNotification('Order placed successfully!', 'success');
            closeOrderModal();
            updateStats();
        }

        // View Supplier Details
        function viewSupplierDetails(id) {
            const supplier = suppliers.find(s => s.id === id);
            if (!supplier) return;

            const supplierOrders = orders.filter(o => o.supplierId === id);
            
            let details = `
                Company: ${supplier.company}\n
                Contact: ${supplier.contact || 'N/A'}\n
                Phone: ${supplier.phone}\n
                Email: ${supplier.email || 'N/A'}\n
                Tax PIN: ${supplier.taxPin || 'N/A'}\n
                Payment Terms: Net ${supplier.terms}\n
                Address: ${supplier.address || 'N/A'}\n
                Products: ${supplier.products.join(', ')}\n
                Notes: ${supplier.notes || 'N/A'}\n
                \nOrder History:\n
            `;

            if (supplierOrders.length === 0) {
                details += 'No orders yet';
            } else {
                supplierOrders.forEach(o => {
                    details += `${o.date} - KSH ${o.total} (${o.status})\n`;
                });
            }

            alert(details);
        }

        // Edit Supplier
        function editSupplier(id) {
            const supplier = suppliers.find(s => s.id === id);
            if (!supplier) return;

            const newCompany = prompt('Enter company name:', supplier.company);
            if (newCompany) supplier.company = newCompany;
            
            const newPhone = prompt('Enter phone number:', supplier.phone);
            if (newPhone) supplier.phone = newPhone;
            
            const newStatus = prompt('Enter status (active/inactive):', supplier.status);
            if (newStatus && (newStatus === 'active' || newStatus === 'inactive')) {
                supplier.status = newStatus;
            }
            
            saveToLocalStorage();
            displaySuppliers();
            showNotification('Supplier updated!', 'success');
        }

        // Delete Supplier
        function deleteSupplier(id) {
            if (confirm('Are you sure you want to delete this supplier?')) {
                suppliers = suppliers.filter(s => s.id !== id);
                saveToLocalStorage();
                displaySuppliers();
                updateStats();
                showNotification('Supplier deleted', 'info');
            }
        }

        // Show Notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 
                                 type === 'error' ? 'fa-exclamation-circle' : 
                                 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
